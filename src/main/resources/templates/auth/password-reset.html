<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reset member password</title></head>
<body><main>
    <h1>Reset member password</h1>
    <p role="status" th:if="${message}" th:text="${message}"></p>
    <p role="alert" th:if="${error}" th:text="${error}"></p>
    <section>
        <h2>Request a reset code</h2>
        <form th:action="@{/password-reset/request}" th:object="${requestForm}" method="post">
            <ul th:if="${#fields.hasAnyErrors()}" role="alert">
                <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
            </ul>
            <p><label for="request-email">Member email</label>
                <input id="request-email" type="email" th:field="*{email}" autocomplete="email"
                       required maxlength="150"></p>
            <button type="submit">Send reset code</button>
        </form>
    </section>
    <section>
        <h2>Choose a new password</h2>
        <form th:action="@{/password-reset/confirm}" th:object="${confirmationForm}" method="post">
            <ul th:if="${#fields.hasAnyErrors()}" role="alert">
                <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
            </ul>
            <p><label for="confirm-email">Member email</label>
                <input id="confirm-email" type="email" th:field="*{email}" autocomplete="email"
                       required maxlength="150"></p>
            <p><label for="code">Six-digit reset code</label>
                <input id="code" type="text" th:field="*{code}" inputmode="numeric" pattern="[0-9]{6}"
                       autocomplete="one-time-code" required maxlength="6"></p>
            <p><label for="new-password">New password</label>
                <input id="new-password" type="password" th:field="*{newPassword}" autocomplete="new-password"
                       required minlength="8" maxlength="256"></p>
            <button type="submit">Reset password</button>
        </form>
    </section>
    <a th:href="@{/login}">Back to sign in</a>
</main></body>
</html>
