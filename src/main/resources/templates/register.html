<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Christian International School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CIS Admission System</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title mb-3 text-center">Register as Member</h3>
            <p class="text-muted small text-center">Parents / Guardians can register and apply for students.</p>

            <div id="errorAlert" class="alert alert-danger d-none"></div>
            <div id="successAlert" class="alert alert-success d-none"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                    Send Verification Code
                </button>
            </form>

            <div class="mt-3 text-center">
                <a href="/login">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('registerBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        btn.disabled = true;
        errorAlert.classList.add('d-none');
        successAlert.classList.add('d-none');

        const email = document.getElementById('email').value;

        try {
            const res = await fetch('/api/public/membership/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email })
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.message || 'Registration failed');
            }

            successAlert.textContent = 'Verification code sent. Please check your email.';
            successAlert.classList.remove('d-none');

            // Redirect to verify page after short delay
            setTimeout(() => {
                window.location.href = '/verify-email?email=' + encodeURIComponent(email);
            }, 1500);
        } catch (err) {
            errorAlert.textContent = err.message;
            errorAlert.classList.remove('d-none');
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
