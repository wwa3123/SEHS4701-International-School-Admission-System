<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Change administrator password</title></head>
<body><main><h1>Change administrator password</h1>
<p role="alert" th:if="${error}" th:text="${error}"></p>
<p>After changing your password, sign in again.</p>
<form th:action="@{/admin/password}" method="post">
    <label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Change password</button>
</form><a th:href="@{/}">Home</a>
<form th:action="@{/logout}" method="post"><button type="submit">Sign out</button></form>
</main></body></html>
