<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Waiting list</title>    <link th:href="@{/vendor/bootstrap/5.3.2/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/site.css}" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
    <main><h1>Waiting list</h1>
<p class="page-intro">This waiting list is not ranked. Applications are never promoted automatically; the administrator chooses who receives an available seat or keeps it for transfer students.</p>
<ul><li th:each="item : ${waitingList}"><span th:text="${item.applicationNumber}"></span>
    <span th:text="${item.fullName}"></span> <span th:text="${item.dateOfBirth}"></span>
    <a th:href="@{/admin/applications/{number}/result(number=${item.applicationNumber})}">Set result</a></li></ul>
<a th:href="@{/admin/applications(programmeLevelId=${programmeLevelId})}">Back to applications</a>
</main></body></html>
