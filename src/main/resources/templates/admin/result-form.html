<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Set application result</title></head>
<body><main>
<h1>Set or correct result</h1><p>Application: <span th:text="${number}"></span></p>
<p>Results are released immediately. Corrections require a super administrator and a reason.</p>
<p role="alert" th:if="${error}" th:text="${error}"></p>
<form th:action="@{/admin/applications/{number}/result(number=${number})}" th:object="${resultForm}" method="post">
    <ul role="alert" th:if="${#fields.hasAnyErrors()}"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
    <label for="result">Result</label><select id="result" th:field="*{result}" required>
        <option value="">Select a result</option><option value="Success">Success</option><option value="Wait">Wait</option><option value="Fail">Fail</option>
    </select>
    <label for="reason">Correction reason (if correcting a result)</label><textarea id="reason" th:field="*{reason}" maxlength="255"></textarea>
    <button type="submit">Save and release result</button>
</form><a th:href="@{/admin/applications}">Back to applications</a>
</main></body></html>
