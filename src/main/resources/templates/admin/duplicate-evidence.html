<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Application evidence</title></head>
<body><main><h1>Application evidence</h1>
<dl>
    <dt>Application</dt><dd th:text="${evidence.applicationNumber}"></dd>
    <dt>Member email</dt><dd th:text="${evidence.memberEmail}"></dd>
    <dt>Applicant</dt><dd th:text="${evidence.fullName}"></dd>
    <dt>Date of birth</dt><dd th:text="${evidence.dateOfBirth}"></dd>
    <dt>Gender</dt><dd th:text="${evidence.gender}"></dd>
    <dt>Phone</dt><dd th:text="${evidence.phone}"></dd>
    <dt>Previous school</dt><dd th:text="${evidence.previousSchool}"></dd>
    <dt>Document type</dt><dd th:text="${evidence.documentType}"></dd>
    <dt>Document number</dt><dd th:text="${evidence.documentNumber}"></dd>
    <dt>Issuing country</dt><dd th:text="${evidence.issuingCountry}"></dd>
    <dt>Academic year</dt><dd th:text="${evidence.academicYear}"></dd>
    <dt>Status</dt><dd th:text="${evidence.status}"></dd>
</dl><a th:href="@{/admin/applications/possible-duplicates}">Back to possible duplicates</a>
</main></body></html>
