<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reset officer password</title></head>
<body><main>
<h1>Reset officer password</h1>
<p role="alert" th:if="${error}" th:text="${error}"></p>
<form method="post" th:action="@{/super-admin/admissions-officers/{id}/password(id=${officerId})}" th:object="${passwordForm}">
<p role="alert" th:if="${#fields.hasAnyErrors()}">Enter a valid temporary password.</p>
<label for="newPassword">Temporary password (8 characters minimum, 72 UTF-8 bytes maximum)</label>
<input id="newPassword" name="newPassword" type="password" required minlength="8" autocomplete="new-password">
<p>This invalidates existing sessions and requires a password change at next login.</p>
<button type="submit">Reset password</button>
</form>
<a th:href="@{/super-admin/admissions-officers}">Cancel</a>
</main></body></html>
