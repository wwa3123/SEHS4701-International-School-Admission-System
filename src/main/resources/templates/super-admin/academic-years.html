<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Manage academic years</title>    <link th:href="@{/vendor/bootstrap/5.3.2/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/site.css}" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header th:replace="~{fragments/navigation :: navigation}"></header>
<main><h1>Manage academic years</h1>
<p role="status" th:if="${message}" th:text="${message}"></p>
<a th:href="@{/super-admin/academic-years/new}">Create academic year</a>
<ul><li th:each="year : ${years}">
<a th:href="@{/super-admin/academic-years/{id}(id=${year.id})}" th:text="${year.name}"></a>
<span th:text="${year.status}"></span>
</li></ul>
</main></body></html>
