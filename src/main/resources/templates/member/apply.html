<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Application - CIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CIS Admission System</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/my-applications">My Applications</a>
            <a class="nav-link" href="/dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container my-5" style="max-width: 700px;">
    <h2 class="mb-4">Submit Admission Application</h2>

    <div id="errorAlert" class="alert alert-danger d-none"></div>
    <div id="successAlert" class="alert alert-success d-none"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form id="applyForm">
                <!-- Applicant Selection -->
                <div class="mb-3">
                    <label class="form-label">Select Applicant <span class="text-danger">*</span></label>
                    <select class="form-select" id="applicantId" required>
                        <option value="">-- Select Applicant --</option>
                        <!-- Options should be loaded from API later -->
                    </select>
                    <div class="form-text">You can manage applicants in your member profile.</div>
                </div>

                <!-- Programme Level -->
                <div class="mb-3">
                    <label class="form-label">Programme Level <span class="text-danger">*</span></label>
                    <select class="form-select" id="programmeLevelId" required>
                        <option value="">-- Select Programme Level --</option>
                        <!-- Will be loaded from open academic year -->
                    </select>
                </div>

                <hr>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="declaration" required>
                    <label class="form-check-label" for="declaration">
                        I declare that the information provided is true and correct. I consent to the collection and use of personal data under the Personal Data (Privacy) Ordinance, and as parent/guardian I consent to this application.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Submit Application</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Load open programme levels
    async function loadProgrammeLevels() {
        try {
            const res = await fetch('/api/public/academic-years/open-for-application', {
                credentials: 'include'
            });
            if (!res.ok) return;

            const year = await res.json();
            const select = document.getElementById('programmeLevelId');

            if (year.programmeLevels) {
                year.programmeLevels.forEach(level => {
                    const opt = document.createElement('option');
                    opt.value = level.id;
                    opt.textContent = `${level.levelCode} - ${level.programmeName}`;
                    select.appendChild(opt);
                });
            }
        } catch (err) {
            console.error('Failed to load programme levels', err);
        }
    }

    // TODO: Load applicants from member API when available
    // For now user needs to know the applicantId or you can hardcode for testing

    document.getElementById('applyForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        btn.disabled = true;
        errorAlert.classList.add('d-none');
        successAlert.classList.add('d-none');

        const payload = {
            applicantId: Number(document.getElementById('applicantId').value),
            programmeLevelId: Number(document.getElementById('programmeLevelId').value)
        };

        try {
            const res = await fetch('/api/member/applications', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(payload)
            });

            if (res.status === 401) {
                window.location.href = '/login';
                return;
            }

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.message || 'Failed to submit application');
            }

            successAlert.textContent = 'Application submitted successfully! Redirecting...';
            successAlert.classList.remove('d-none');

            setTimeout(() => {
                window.location.href = '/my-applications';
            }, 1500);
        } catch (err) {
            errorAlert.textContent = err.message;
            errorAlert.classList.remove('d-none');
            btn.disabled = false;
        }
    });

    loadProgrammeLevels();
</script>
</body>
</html>
