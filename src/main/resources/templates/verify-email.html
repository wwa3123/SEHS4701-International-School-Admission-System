<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale==1.0">
    <title>Verify Email - CIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CIS Admission System</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title mb-3 text-center">Verify Your Email</h3>
            <p class="text-muted small text-center">Enter the 6-digit code sent to your email.</p>

            <div id="errorAlert" class="alert alert-danger d-none"></div>
            <div id="successAlert" class="alert alert-success d-none"></div>

            <form id="verifyForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" readonly>
                </div>
                <div class="mb-3">
                    <label for="code" class="form-label">Verification Code</label>
                    <input type="text" class="form-control" id="code" maxlength="6" placeholder="123456" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="verifyBtn">Verify Code</button>
            </form>

            <div class="mt-3 text-center">
                <button class="btn btn-link btn-sm" id="resendBtn">Resend Code</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Get email from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const emailFromUrl = urlParams.get('email') || '';
    document.getElementById('email').value = emailFromUrl;

    document.getElementById('verifyForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('verifyBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        btn.disabled = true;
        errorAlert.classList.add('d-none');
        successAlert.classList.add('d-none');

        const email = document.getElementById('email').value;
        const code = document.getElementById('code').value;

        try {
            const res = await fetch('/api/public/membership/verify-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email, code })
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.message || 'Invalid or expired code');
            }

            successAlert.textContent = 'Email verified successfully! Redirecting...';
            successAlert.classList.remove('d-none');

            setTimeout(() => {
                window.location.href = '/complete-registration?email=' + encodeURIComponent(email);
            }, 1200);
        } catch (err) {
            errorAlert.textContent = err.message;
            errorAlert.classList.remove('d-none');
            btn.disabled = false;
        }
    });

    // Resend code
    document.getElementById('resendBtn').addEventListener('click', async function () {
        const email = document.getElementById('email').value;
        if (!email) return alert('Email is missing');

        try {
            const res = await fetch('/api/public/membership/resend-verification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email })
            });
            alert(res.ok ? 'A new code has been sent.' : 'Failed to resend code.');
        } catch (err) {
            alert('Failed to resend code.');
        }
    });
</script>
</body>
</html>
