# Application Properties for CISSAS Spring Boot Application
spring.application.name=CISSAS

# Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/cissas?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Identity document encryption
identity-document.encryption.secret=${HKID_SECRET}
identity-document.encryption.salt=${HKID_SALT}