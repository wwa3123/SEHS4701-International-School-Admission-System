# Application Properties for CISSAS Spring Boot Application
spring.application.name=CISSAS

spring.profiles.active=dev

# Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/cissas?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Identity document encryption
identity-document.encryption.secret=${IDENTITY_DOCUMENT_SECRET}
identity-document.encryption.salt=${IDENTITY_DOCUMENT_SALT}
identity-document.hash.pepper=${IDENTITY_DOCUMENT_HASH_PEPPER:}

# OTC code hashing
otc.code.hash.pepper=${OTC_CODE_HASH_PEPPER:}

# Email Config
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=utf-8